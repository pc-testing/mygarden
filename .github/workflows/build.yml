name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mygarden.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mygarden-apk
          path: mygarden.apk
      - name: Publish as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          sleep 3
          gh release create latest mygarden.apk --title "Latest build" \
            --notes "Build $GITHUB_RUN_NUMBER from commit $GITHUB_SHA" --target "$GITHUB_SHA"
